[project]
name = "engram"
version = "0.1.0"
description = "Curated git-native agent memory: service-less semantic recall + gated LLM curator"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "huggingface-hub>=1.21.0",
]

[project.scripts]
engram = "engram.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]
